spring:
  profiles:
    active: dev
  application:
    name: cv-builder-backend
  main:
    allow-bean-definition-overriding: true
  
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # CORS Configuration
 # web:
   # cors:
    #  allowed-origins: "http://localhost:3000"
     # allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      #allowed-headers: "*"
    #  allow-credentials: true

# CV Storage
cv:
  storage:
    path: ./generated-cvs/
  max-file-size: 10MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 30m
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging
logging:
  level:
    com.cvbuilder: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/cv-builder.log

# Actuator (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Profile-specific settings
---
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:cvbuilder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.cvbuilder: TRACE
    org.hibernate: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://production-server:5432/cvbuilder_prod
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:strong_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8080

logging:
  level:
    com.cvbuilder: INFO
    org.hibernate: WARN
  file:
    name: /var/log/cv-builder/application.log